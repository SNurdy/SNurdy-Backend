name: SNurdy-Dev-CD

on:
  workflow_dispatch:
    inputs:
      env:
        description: "배포 환경 (dev/prod)"
        required: true
        default: "dev"
        type: string

jobs:
  pre-deploy-verify:
    name: 배포 전 통합 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Docker 사용 가능 여부 확인
        run: docker info

      - name: Gradle 통합 테스트 실행
        run: |
          chmod +x gradlew
          ./gradlew clean test \
            --tests "*P0EndpointSmokeTest" \
            --tests "*MigrationFlowSmokeTest"

  build-and-push:
    name: 빌드 및 이미지 푸시
    needs: pre-deploy-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Gradle 아티팩트 빌드
        run: chmod +x gradlew && ./gradlew clean bootJar -x test

      - name: 배포 파일 준비
        run: |
          mkdir -p deployment/build/libs
          cp infra/Dockerfile deployment/
          cp infra/dev/docker-compose-dev.yml deployment/
          cp build/libs/snurdy-backend-*-SNAPSHOT.jar deployment/build/libs/app.jar

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./deployment
          file: ./deployment/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/snurdy-app-dev:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/snurdy-app-dev:${{ github.sha }}

  deploy:
    name: EC2 배포
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Actions IP 조회
        id: ip
        uses: candidob/get-runner-ip@v1.0.0

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: 보안 그룹에 IP 추가
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_DEV_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true

      - name: EC2 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_DEV_SSH_PRIVATE_KEY }}
          script: |
            IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/snurdy-app-dev"
            cd ~/snurdy-backend/deployment
            docker pull ${IMAGE_NAME}:latest
            docker-compose -f docker-compose-dev.yml up -d --force-recreate app-dev
            docker image prune -f

      - name: 보안 그룹에서 IP 제거
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_DEV_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true
