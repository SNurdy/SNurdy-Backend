name: SNurdy-Prod-CD

on:
  workflow_dispatch:

jobs:
  guard:
    name: 브랜치 검증
    runs-on: ubuntu-24.04
    steps:
      - name: main 브랜치 확인
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Prod 배포는 main 브랜치에서만 가능합니다. 현재: ${{ github.ref }}"
          exit 1

  pre-deploy-verify:
    name: 배포 전 통합 검증
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Docker 사용 가능 여부 확인
        run: docker info

      - name: Gradle 통합 테스트 실행
        run: |
          chmod +x gradlew
          ./gradlew clean test \
            --tests "*CoreApiSmokeTest" \
            --tests "*MigrationFlowSmokeTest"

  build-and-push:
    name: 빌드 및 이미지 푸시
    needs: pre-deploy-verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Gradle 빌드
        run: chmod +x gradlew && ./gradlew clean bootJar -x test

      - name: 배포 파일 준비
        run: |
          mkdir -p deployment/build/libs
          cp infra/Dockerfile deployment/
          cp build/libs/snurdy-backend-*-SNAPSHOT.jar deployment/build/libs/app.jar

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./deployment
          file: ./deployment/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/snurdy-app-prod:${{ github.sha }}

  deploy:
    name: Prod 배포
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: GitHub Actions IP 조회
        id: ip
        uses: candidob/get-runner-ip@v1.0.0

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_PROD_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_PROD_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: 보안 그룹에 IP 추가
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_PROD_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true

      - name: Prod 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PROD_SSH_PRIVATE_KEY }}
          script: |
            /app/shared/deploy.sh ${{ github.sha }}

      - name: 보안 그룹에서 IP 제거
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_PROD_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true