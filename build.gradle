plugins {
    // 1. Kotlin JVM 플러그인을 가장 먼저 선언하는 것이 좋습니다.
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.22'
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.22'

    id 'org.springframework.boot' version '3.4.2' // 4.0.1에서 안정 버전으로 내림
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.snurdy'
version = '0.0.1-SNAPSHOT'

// Kotlin 프로젝트에서는 java toolchain 대신 kotlin 설정을 주로 사용합니다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // jvmTarget과 맞춤
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Kotlin 필수 라이브러리
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web' // webmvc -> web

    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    kotlinOptions {
        freeCompilerArgs = ['-Xjsr305=strict']
        jvmTarget = '17'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}