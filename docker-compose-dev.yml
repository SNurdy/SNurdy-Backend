services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile-dev
    container_name: snurdy-app-dev
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://snurdy-db-dev:3306/snurdy_dev
      SPRING_DATASOURCE_USERNAME: snurdy
      SPRING_DATASOURCE_PASSWORD: snurdy
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - snurdy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  snurdy-network:
    external: true