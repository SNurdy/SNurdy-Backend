services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snurdy-app-dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8080:8080"
    networks:
      - snurdy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  snurdy-network:
    external: true