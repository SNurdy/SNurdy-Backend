version: '3.8'

services:
  snurdy-db-local:
    image: mysql:8.0
    container_name: snurdy-db-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: snurdy_dev
      MYSQL_USER: snurdy
      MYSQL_PASSWORD: snurdy
    ports:
      - "3306:3306"
    volumes:
      - mysql-local-data:/var/lib/mysql

volumes:
  mysql-local-data: