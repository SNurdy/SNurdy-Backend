version: '3.8'
services:
  db-prod:
    image: mysql:8.0
    container_name: snurdy-db-prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile-prod
    container_name: snurdy-app-prod
    restart: always
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      - db-prod
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate