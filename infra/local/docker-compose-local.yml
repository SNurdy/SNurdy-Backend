services:
  snurdy-db-local:
    image: mysql:8.0
    container_name: snurdy-db-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: snurdy_dev
      MYSQL_USER: snurdy
      MYSQL_PASSWORD: snurdy
    ports:
      - "3306:3306"
    volumes:
      - mysql-local-data:/var/lib/mysql

  snurdy-redis-local:
    image: redis:7-alpine
    container_name: snurdy-redis-local
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-local-data:/data

  snurdy-aws-local:
    image: localstack/localstack:2026.9.0
    container_name: snurdy-aws-local
    restart: always
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,ses
      AWS_DEFAULT_REGION: ap-northeast-2
      SQS_ENDPOINT_STRATEGY: path
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro

volumes:
  mysql-local-data:
  redis-local-data: