services:
  snurdy-db-local:
    image: mysql:8.0
    container_name: snurdy-db-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: snurdy_dev
      MYSQL_USER: snurdy
      MYSQL_PASSWORD: snurdy
    ports:
      - "3306:3306"
    volumes:
      - mysql-local-data:/var/lib/mysql

  snurdy-redis-local:
    image: redis:7-alpine
    container_name: snurdy-redis-local
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-local-data:/data

volumes:
  mysql-local-data:
  redis-local-data: