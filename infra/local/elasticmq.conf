include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  inquiry-mail {
    defaultVisibilityTimeout = 10 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "inquiry-mail-dlq"
      maxReceiveCount = 5
    }
  }
  inquiry-mail-dlq {}
}