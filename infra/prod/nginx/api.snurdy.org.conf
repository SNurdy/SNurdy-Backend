log_format detailed '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name api.snurdy.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name api.snurdy.org;

    # 업로드 한도
    client_max_body_size 10m;

    # JSON 응답 압축
    gzip_types application/json;
    gzip_proxied any;
    gzip_min_length 1024;

    # SSL
    ssl_certificate /etc/letsencrypt/live/api.snurdy.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.snurdy.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 로그
    access_log /var/log/nginx/api_access.log detailed;
    error_log /var/log/nginx/api_error.log;

    # 프록시 타임아웃
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location / {
        proxy_pass http://spring_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/actuator {
        deny all;
        return 403;
    }
}
