spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

storage:
  s3:
    object-prefix: "local/"

cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://localhost:8081"

spring.cloud.aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:local}
    secret-key: ${AWS_SECRET_ACCESS_KEY:local}
  sqs:
    endpoint: http://localhost:4566
  ses:
    endpoint: http://localhost:4566