spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

storage:
  s3:
    object-prefix: "local/"

cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://localhost:8081"
