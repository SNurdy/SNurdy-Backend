<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS 반영</title>
    <style>
        :root { --bg:#f3f6fb; --card:#fff; --line:#d7dfeb; --text:#1f2a36; --muted:#5f7086; --brand:#1362ff; --ok:#067647; --warn:#b54708; --danger:#b42318; }
        * { box-sizing:border-box; }
        body { margin:0; background:linear-gradient(180deg,#f9fbff 0%,var(--bg) 100%); color:var(--text); font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif; }
        .wrap { max-width:1400px; margin:0 auto; padding:20px; }

        .page-nav { display:flex; gap:8px; margin-bottom:10px; }
        .page-link { display:inline-flex; align-items:center; height:34px; padding:0 12px; border:1px solid var(--line); border-radius:999px; color:var(--text); background:#fff; text-decoration:none; font-size:13px; }
        .page-link.active { color:#fff; background:var(--brand); border-color:var(--brand); font-weight:700; }

        .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
        .head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
        .body { padding:16px; }

        /* 탭 */
        .tabs { display:flex; gap:6px; margin-bottom:12px; }
        .tab { border:1px solid var(--line); border-radius:999px; height:32px; padding:0 12px; background:#fff; cursor:pointer; font-size:13px; }
        .tab.active { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:700; }

        .toolbar { display:grid; grid-template-columns: 90px auto; gap:8px; margin-bottom:10px; }
        input, button { border:1px solid var(--line); border-radius:8px; font-size:14px; height:36px; padding:0 10px; }
        button { background:#fff; cursor:pointer; }
        button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
        button.apply   { background:var(--ok); color:#fff; border-color:var(--ok); }
        button.rollback { background:#fffbeb; color:var(--warn); border-color:#fde68a; }

        table { width:100%; border-collapse:collapse; font-size:13px; }
        th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #edf2f8; vertical-align:top; }
        th { color:var(--muted); font-weight:600; }

        .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
        .badge-validated   { background:#d1fadf; color:var(--ok); }
        .badge-applied     { background:#f0f0f0; color:#374151; }
        .badge-rolled_back { background:#fef3c7; color:var(--warn); }

        .warn-text { color:var(--warn); font-size:12px; }

        .log { margin-top:10px; padding:10px; border-radius:8px; background:#111928; color:#dbe8ff; min-height:74px; white-space:pre-wrap; font-size:12px; }
        .muted { color:var(--muted); }
    </style>
</head>
<body>
<div class="wrap">
    <nav class="page-nav">
        <a class="page-link" href="/api/admin/request.html">요청</a>
        <a class="page-link" href="/api/admin/validate-waiting.html">검증/반영대기</a>
        <a class="page-link active" href="/api/admin/apply.html">반영</a>
        <a class="page-link" href="/api/admin/audit-log.html">변경이력</a>
    </nav>

    <section class="panel">
        <div class="head">
            <strong>반영 / 롤백</strong>
            <span class="muted">검증완료 건 반영 · 반영완료 건 롤백</span>
        </div>
        <div class="body">
            <div class="tabs">
                <button class="tab active" data-mode="apply">반영 대기</button>
                <button class="tab" data-mode="rollback">반영완료 (롤백 가능)</button>
            </div>
            <div class="toolbar">
                <input id="size" value="20" />
                <button id="searchBtn" class="primary">조회</button>
            </div>

            <table>
                <thead id="thead">
                <tr>
                    <th>ID</th><th>제목</th><th>유형</th><th>작업</th><th>상태</th><th>경고</th><th>액션</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>

            <div id="log" class="log">준비되었습니다.</div>
        </div>
    </section>
</div>

<script>
    const $ = (id) => document.getElementById(id);
    const sizeInput = $("size"), rowsEl = $("rows"), logEl = $("log");
    const API_BASE = "/api/v1/admin/workflows/change-requests";
    let mode = "apply"; // "apply" | "rollback"

    function writeLog(msg) { logEl.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logEl.textContent; }

    function callApi(path, method = "GET") {
        return fetch(path, { method, headers: { "Content-Type":"application/json", "X-Request-Id":`cms-${Date.now()}` } })
            .then(async res => { const p = await res.json(); if (!res.ok||p.success===false) throw new Error(p.message||`HTTP ${res.status}`); return p.data; });
    }

    function esc(v) { if(v==null) return ""; return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    async function loadList() {
        const size = Number(sizeInput.value||20);
        const status = mode === "apply" ? "VALIDATED" : "APPLIED";
        const params = new URLSearchParams({page:"0",size:String(size),status});
        const data = await callApi(`${API_BASE}?${params}`);
        const items = data.items||[];

        if (!items.length) {
            rowsEl.innerHTML = `<tr><td colspan="7" class="muted">${mode==="apply"?"반영 대기 데이터가 없습니다.":"반영완료 데이터가 없습니다."}</td></tr>`;
            return;
        }

        rowsEl.innerHTML = items.map(it => {
            const badgeCls = mode==="apply" ? "badge-validated" : "badge-applied";
            const badgeLabel = mode==="apply" ? "검증완료" : "반영완료";
            const actionBtn = mode==="apply"
                ? `<button class="apply" data-id="${it.id}">반영</button>`
                : `<button class="rollback" data-id="${it.id}">롤백</button>`;
            return `<tr>
                <td>${it.id}</td><td>${esc(it.title)}</td><td>${it.entityType}</td><td>${it.operation}</td>
                <td><span class="badge ${badgeCls}">${badgeLabel}</span></td>
                <td>${it.warningMessage ? `<span class="warn-text">⚠️ ${esc(it.warningMessage)}</span>` : "-"}</td>
                <td>${actionBtn}</td>
            </tr>`;
        }).join("");

        if (mode === "apply") {
            rowsEl.querySelectorAll("button.apply").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const id = Number(btn.dataset.id);
                    if (!confirm(`요청ID ${id}를 반영하시겠습니까?`)) return;
                    try { const r = await callApi(`${API_BASE}/${id}/apply`,"POST"); writeLog(`반영 완료: 요청ID=${id}, 상태=${r.status}`); await loadList(); }
                    catch(e) { writeLog(`반영 실패: ${e.message}`); }
                });
            });
        } else {
            rowsEl.querySelectorAll("button.rollback").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const id = Number(btn.dataset.id);
                    if (!confirm(`요청ID ${id}를 롤백하시겠습니까?\nbeforeJson 기반으로 데이터가 복원됩니다.`)) return;
                    try { const r = await callApi(`${API_BASE}/${id}/rollback`,"POST"); writeLog(`롤백 완료: 요청ID=${id}, 상태=${r.status}`); await loadList(); }
                    catch(e) { writeLog(`롤백 실패: ${e.message}`); }
                });
            });
        }
    }

    function doSearch() { loadList().catch(e=>writeLog(`조회 실패: ${e.message}`)); }
    $("searchBtn").addEventListener("click", doSearch);
    sizeInput.addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });

    // 탭 전환
    document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
            tab.classList.add("active");
            mode = tab.dataset.mode;
            doSearch();
        });
    });

    loadList().catch(e=>writeLog(`초기 조회 실패: ${e.message}`));
</script>
</body>
</html>
