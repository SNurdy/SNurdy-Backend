<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS 변경이력</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/audit-log.css" />
</head>
<body>

<div class="layout">
    <nav class="nav">
        <a class="nav__link" href="/api/admin/request.html">요청</a>
        <a class="nav__link" href="/api/admin/validate-waiting.html">검증/반영대기</a>
        <a class="nav__link" href="/api/admin/apply.html">반영</a>
        <a class="nav__link nav__link--active" href="/api/admin/audit-log.html">변경이력</a>
    </nav>

    <section class="panel">
        <header class="panel__header">
            <strong>변경이력</strong>
            <span class="text--muted">모든 관리자 액션 기록</span>
        </header>

        <div class="panel__body">
            <div class="toolbar">
                <select id="action" class="input">
                    <option value="">액션 전체</option>
                    <option value="REQUEST">요청</option>
                    <option value="UPDATE">수정</option>
                    <option value="VALIDATE">검증</option>
                    <option value="APPLY">반영</option>
                    <option value="ROLLBACK">롤백</option>
                    <option value="CANCEL">취소</option>
                </select>
                <input id="size" class="input" value="20" />
                <button id="searchBtn" class="btn btn--primary toolbar__search">조회</button>
            </div>

            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>액션</th>
                    <th>변경 내용</th>
                    <th>시각</th>
                    <th>상세</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>

            <div class="pager">
                <button id="prevBtn" class="btn">이전</button>
                <span id="pageInfo">페이지 1 / 1</span>
                <button id="nextBtn" class="btn">다음</button>
                <span id="countInfo">총 0건</span>
            </div>

            <div id="log" class="log">준비되었습니다.</div>
        </div>
    </section>
</div>

<!-- 모달 -->
<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <button class="modal__close" id="modalClose">&times;</button>
        <div id="modalContent"></div>
    </div>
</div>

<script src="js/common.js"></script>
<script src="js/audit-log.js"></script>
</body>
</html>
