<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS Change Set Console</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --line: #d9e1ee;
            --text: #1d2733;
            --muted: #5b6b7f;
            --accent: #1457ff;
            --ok: #0f7b48;
            --warn: #a56300;
            --bad: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
            background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
            color: var(--text);
        }
        .wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .top {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 10px;
            align-items: center;
        }
        .top input, .top select, button {
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
        }
        button {
            background: #fff;
            cursor: pointer;
        }
        button.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .grid {
            margin-top: 16px;
            display: grid;
            grid-template-columns: 42% 58%;
            gap: 14px;
        }
        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
        }
        .panel h2 {
            margin: 0;
            font-size: 16px;
            padding: 14px;
            border-bottom: 1px solid var(--line);
        }
        .panel .body { padding: 14px; }
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .table th, .table td {
            border-bottom: 1px solid #eef2f8;
            text-align: left;
            padding: 8px 6px;
        }
        .table th { color: var(--muted); font-weight: 600; }
        .table tr:hover { background: #f8fbff; }
        .table tr.selected { background: #edf4ff; }
        .badge {
            display: inline-block;
            border-radius: 999px;
            padding: 3px 9px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-DRAFT, .status-PENDING { background: #eef2f8; color: #44556b; }
        .status-VALIDATED, .status-APPLIED, .status-APPLIED_DEV, .status-APPLIED_PROD { background: #e7f8ef; color: var(--ok); }
        .status-APPROVED { background: #e8f0ff; color: var(--accent); }
        .status-FAILED { background: #feeceb; color: var(--bad); }
        .status-SKIPPED { background: #fff4e5; color: var(--warn); }
        .meta {
            display: grid;
            grid-template-columns: 160px 1fr;
            row-gap: 8px;
            font-size: 13px;
        }
        .meta .k { color: var(--muted); }
        .actions {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .summary {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .summary .box {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
        }
        .summary .n { font-size: 20px; font-weight: 700; }
        .summary .t { font-size: 12px; color: var(--muted); }
        .log {
            margin-top: 10px;
            background: #101927;
            color: #dce8ff;
            border-radius: 10px;
            padding: 12px;
            min-height: 80px;
            white-space: pre-wrap;
            font-size: 12px;
        }
        .error-row { background: #fff4f3; }
        .muted { color: var(--muted); }
        .form-grid {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .form-grid .full { grid-column: 1 / -1; }
        .form-grid input, .form-grid select, .form-grid textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
        }
        .form-grid textarea {
            min-height: 70px;
            resize: vertical;
        }
        .section-title {
            margin-top: 14px;
            font-size: 13px;
            font-weight: 700;
        }
        .json-btn {
            height: 28px;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 12px;
        }
        .json-viewer {
            margin-top: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }
        .json-viewer .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            background: #f8fbff;
            font-size: 13px;
        }
        .json-viewer pre {
            margin: 0;
            padding: 12px;
            background: #101927;
            color: #dce8ff;
            font-size: 12px;
            max-height: 260px;
            overflow: auto;
            white-space: pre-wrap;
        }
        .diff-list {
            margin: 0;
            padding: 12px 18px;
            background: #fff;
            border-top: 1px solid var(--line);
            font-size: 12px;
        }
        .diff-list li { margin: 4px 0; }
        .diff-list code { background: #f1f5fb; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <input id="token" type="password" placeholder="Bearer 토큰 입력 (JWT access token)" />
        <select id="statusFilter">
            <option value="">전체 상태</option>
            <option>DRAFT</option>
            <option>VALIDATED</option>
            <option>APPROVED</option>
            <option>FAILED</option>
            <option>APPLIED_DEV</option>
            <option>APPLIED_PROD</option>
        </select>
        <button id="loadBtn" class="primary">목록 새로고침</button>
        <button id="saveTokenBtn">토큰 저장</button>
    </div>

    <div class="grid">
        <section class="panel">
            <h2>Change Set 목록</h2>
            <div class="body">
                <table class="table" id="listTable">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>제목</th>
                        <th>상태</th>
                        <th>항목</th>
                        <th>실패</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="panel">
            <h2>상세 / 검증결과</h2>
            <div class="body">
                <div class="section-title">Change Set 생성</div>
                <div class="form-grid">
                    <input id="csTitle" class="full" placeholder="제목 (예: 호흡기 용어 3건 수정)" />
                    <input id="csSourceEnv" value="DEV" placeholder="sourceEnv (DEV)" />
                    <input id="csTargetEnv" value="PROD" placeholder="targetEnv (PROD)" />
                    <textarea id="csDescription" class="full" placeholder="설명"></textarea>
                    <button id="createCsBtn" class="primary full">Change Set 생성</button>
                </div>

                <div class="section-title">단어 변경 항목 추가</div>
                <div class="form-grid">
                    <select id="termOperation">
                        <option value="CREATE">CREATE</option>
                        <option value="UPDATE">UPDATE</option>
                        <option value="DELETE">DELETE</option>
                    </select>
                    <input id="termId" placeholder="termId (UPDATE/DELETE 필수)" />
                    <input id="termSpelling" class="full" placeholder="spelling (CREATE/UPDATE 필수)" />
                    <input id="termMeaning" class="full" placeholder="meaning (CREATE/UPDATE 필수)" />
                    <input id="termAbbreviation" placeholder="abbreviation" />
                    <input id="termSortOrder" placeholder="sortOrder(선택)" />
                    <textarea id="termExplanation" class="full" placeholder="explanation"></textarea>
                    <button id="addTermItemBtn" class="full">현재 Change Set에 항목 추가</button>
                </div>

                <div id="detailMeta" class="meta muted">좌측 목록에서 Change Set을 선택하세요.</div>

                <div class="actions">
                    <button id="validateBtn" class="primary">Validate</button>
                    <button id="approveBtn">Approve</button>
                    <button id="applyBtn">Apply</button>
                </div>

                <div class="summary">
                    <div class="box">
                        <div id="totalCount" class="n">0</div>
                        <div class="t">Total</div>
                    </div>
                    <div class="box">
                        <div id="successCount" class="n">0</div>
                        <div class="t">Success</div>
                    </div>
                    <div class="box">
                        <div id="failedCount" class="n">0</div>
                        <div class="t">Failed</div>
                    </div>
                </div>

                <table class="table" id="itemsTable" style="margin-top: 12px;">
                    <thead>
                    <tr>
                        <th>순서</th>
                        <th>엔티티</th>
                        <th>PK</th>
                        <th>작업</th>
                        <th>상태</th>
                        <th>변경</th>
                        <th>오류</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>

                <div class="json-viewer" id="jsonViewer">
                    <div class="head">
                        <strong id="jsonTitle">변경 상세(JSON)</strong>
                        <span class="muted" id="jsonHint">행에서 보기 버튼을 누르세요.</span>
                    </div>
                    <pre id="jsonContent">-</pre>
                    <ul id="diffList" class="diff-list"></ul>
                </div>

                <div id="consoleLog" class="log">Ready.</div>
            </div>
        </section>
    </div>
</div>

<script>
    const apiBase = "/api/v1/admin/change-sets";
    const tokenInput = document.getElementById("token");
    const statusFilter = document.getElementById("statusFilter");
    const listBody = document.querySelector("#listTable tbody");
    const itemsBody = document.querySelector("#itemsTable tbody");
    const detailMeta = document.getElementById("detailMeta");
    const logBox = document.getElementById("consoleLog");
    const totalCount = document.getElementById("totalCount");
    const successCount = document.getElementById("successCount");
    const failedCount = document.getElementById("failedCount");
    const jsonTitle = document.getElementById("jsonTitle");
    const jsonContent = document.getElementById("jsonContent");
    const diffList = document.getElementById("diffList");
    const csTitle = document.getElementById("csTitle");
    const csDescription = document.getElementById("csDescription");
    const csSourceEnv = document.getElementById("csSourceEnv");
    const csTargetEnv = document.getElementById("csTargetEnv");
    const termOperation = document.getElementById("termOperation");
    const termId = document.getElementById("termId");
    const termSpelling = document.getElementById("termSpelling");
    const termMeaning = document.getElementById("termMeaning");
    const termAbbreviation = document.getElementById("termAbbreviation");
    const termExplanation = document.getElementById("termExplanation");
    const termSortOrder = document.getElementById("termSortOrder");

    let selectedChangeSetId = null;
    let cachedList = [];

    function token() {
        return tokenInput.value.trim();
    }

    function writeLog(message) {
        logBox.textContent = `[${new Date().toLocaleTimeString()}] ${message}\n` + logBox.textContent;
    }

    function statusBadge(status) {
        return `<span class="badge status-${status}">${status}</span>`;
    }

    function parseJsonSafe(raw) {
        if (!raw) return null;
        try {
            return JSON.parse(raw);
        } catch (_) {
            return raw;
        }
    }

    function prettyJson(raw) {
        const obj = parseJsonSafe(raw);
        if (obj === null) return "-";
        if (typeof obj === "string") return obj;
        return JSON.stringify(obj, null, 2);
    }

    function diffKeys(beforeRaw, afterRaw) {
        const beforeObj = parseJsonSafe(beforeRaw);
        const afterObj = parseJsonSafe(afterRaw);
        if (!beforeObj || typeof beforeObj !== "object" || !afterObj || typeof afterObj !== "object") {
            return [];
        }
        const keys = new Set([...Object.keys(beforeObj), ...Object.keys(afterObj)]);
        const changed = [];
        for (const key of keys) {
            const beforeVal = beforeObj[key];
            const afterVal = afterObj[key];
            if (JSON.stringify(beforeVal) !== JSON.stringify(afterVal)) {
                changed.push({ key, beforeVal, afterVal });
            }
        }
        return changed;
    }

    function showJsonDetail(item) {
        jsonTitle.textContent = `Item #${item.id} (${item.operation} ${item.entityType}:${item.entityPk})`;
        jsonContent.textContent =
            `[before_json]\n${prettyJson(item.beforeJson)}\n\n[after_json]\n${prettyJson(item.afterJson)}`;

        const diffs = diffKeys(item.beforeJson, item.afterJson);
        if (diffs.length === 0) {
            diffList.innerHTML = `<li class="muted">변경 필드 비교 결과가 없습니다.</li>`;
            return;
        }

        diffList.innerHTML = diffs
            .map(d => `<li><code>${d.key}</code>: <strong>${JSON.stringify(d.beforeVal)}</strong> → <strong>${JSON.stringify(d.afterVal)}</strong></li>`)
            .join("");
    }

    async function callApi(path, method = "GET", body = null) {
        const headers = { "Content-Type": "application/json" };
        if (token()) headers["Authorization"] = `Bearer ${token()}`;
        headers["X-Request-Id"] = `cms-${Date.now()}`;

        const fetchOptions = { method, headers };
        if (body !== null) {
            fetchOptions.body = JSON.stringify(body);
        }
        const res = await fetch(path, fetchOptions);
        const payload = await res.json();
        if (!res.ok || payload.success === false) {
            const msg = payload?.message || `HTTP ${res.status}`;
            throw new Error(msg);
        }
        return payload.data;
    }

    function renderList(rows) {
        listBody.innerHTML = "";
        const filtered = rows.filter(row => !statusFilter.value || row.status === statusFilter.value);
        for (const row of filtered) {
            const tr = document.createElement("tr");
            tr.dataset.id = row.id;
            if (row.id === selectedChangeSetId) tr.classList.add("selected");
            tr.innerHTML = `
                <td>${row.id}</td>
                <td>${row.title}</td>
                <td>${statusBadge(row.status)}</td>
                <td>${row.totalItems}</td>
                <td>${row.failedItems}</td>
            `;
            tr.addEventListener("click", () => selectChangeSet(row.id));
            listBody.appendChild(tr);
        }
    }

    function renderDetail(detail) {
        detailMeta.classList.remove("muted");
        detailMeta.innerHTML = `
            <div class="k">ID</div><div>${detail.id}</div>
            <div class="k">제목</div><div>${detail.title}</div>
            <div class="k">상태</div><div>${statusBadge(detail.status)}</div>
            <div class="k">환경</div><div>${detail.sourceEnv} → ${detail.targetEnv}</div>
            <div class="k">요청자</div><div>${detail.requestedBy}</div>
            <div class="k">승인자</div><div>${detail.approvedBy || "-"}</div>
            <div class="k">적용자</div><div>${detail.appliedBy || "-"}</div>
            <div class="k">설명</div><div>${detail.description || "-"}</div>
        `;

        itemsBody.innerHTML = "";
        let success = 0;
        let failed = 0;
        for (const item of detail.items) {
            if (item.status === "FAILED") failed++;
            else if (item.status === "VALIDATED" || item.status === "APPLIED") success++;
            const tr = document.createElement("tr");
            if (item.status === "FAILED") tr.classList.add("error-row");
            tr.innerHTML = `
                <td>${item.sortOrder}</td>
                <td>${item.entityType}</td>
                <td>${item.entityPk}</td>
                <td>${item.operation}</td>
                <td>${statusBadge(item.status)}</td>
                <td><button class="json-btn" data-item='${JSON.stringify(item).replaceAll("'", "&#39;")}'>보기</button></td>
                <td>${item.errorCode ? `${item.errorCode}: ${item.errorMessage || ""}` : "-"}</td>
            `;
            itemsBody.appendChild(tr);
        }

        itemsBody.querySelectorAll(".json-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const item = JSON.parse(btn.dataset.item.replaceAll("&#39;", "'"));
                showJsonDetail(item);
            });
        });

        totalCount.textContent = String(detail.items.length);
        successCount.textContent = String(success);
        failedCount.textContent = String(failed);
    }

    async function loadList() {
        try {
            const data = await callApi(apiBase, "GET");
            cachedList = data.changeSets || [];
            renderList(cachedList);
            writeLog(`목록 조회 성공 (${cachedList.length}건)`);
            if (selectedChangeSetId) {
                const exists = cachedList.some(c => c.id === selectedChangeSetId);
                if (exists) await selectChangeSet(selectedChangeSetId, false);
            }
        } catch (e) {
            writeLog(`목록 조회 실패: ${e.message}`);
        }
    }

    async function selectChangeSet(id, silent = false) {
        selectedChangeSetId = id;
        renderList(cachedList);
        try {
            const detail = await callApi(`${apiBase}/${id}`, "GET");
            renderDetail(detail);
            if (!silent) writeLog(`상세 조회 성공 (changeSetId=${id})`);
        } catch (e) {
            writeLog(`상세 조회 실패: ${e.message}`);
        }
    }

    async function runAction(action) {
        if (!selectedChangeSetId) {
            writeLog("먼저 Change Set을 선택하세요.");
            return;
        }
        try {
            const data = await callApi(`${apiBase}/${selectedChangeSetId}/${action}`, "POST");
            writeLog(`${action.toUpperCase()} 성공: status=${data.status}, success=${data.successItems}, failed=${data.failedItems}`);
            await loadList();
            await selectChangeSet(selectedChangeSetId, true);
        } catch (e) {
            writeLog(`${action.toUpperCase()} 실패: ${e.message}`);
        }
    }

    async function createChangeSet() {
        const title = csTitle.value.trim();
        if (!title) {
            writeLog("Change Set 제목은 필수입니다.");
            return;
        }
        try {
            const data = await callApi(`${apiBase}`, "POST", {
                title,
                description: csDescription.value.trim() || null,
                sourceEnv: (csSourceEnv.value || "DEV").trim().toUpperCase(),
                targetEnv: (csTargetEnv.value || "PROD").trim().toUpperCase()
            });
            writeLog(`Change Set 생성 성공: id=${data.changeSetId}`);
            csTitle.value = "";
            csDescription.value = "";
            await loadList();
            await selectChangeSet(data.changeSetId, true);
        } catch (e) {
            writeLog(`Change Set 생성 실패: ${e.message}`);
        }
    }

    async function addTermItem() {
        if (!selectedChangeSetId) {
            writeLog("먼저 Change Set을 선택하세요.");
            return;
        }

        const operation = termOperation.value;
        const body = {
            operation,
            termId: termId.value.trim() ? Number(termId.value.trim()) : null,
            spelling: termSpelling.value.trim() || null,
            meaning: termMeaning.value.trim() || null,
            abbreviation: termAbbreviation.value.trim() || null,
            explanation: termExplanation.value.trim() || null,
            sortOrder: termSortOrder.value.trim() ? Number(termSortOrder.value.trim()) : null
        };

        try {
            const data = await callApi(`${apiBase}/${selectedChangeSetId}/items/term`, "POST", body);
            writeLog(`항목 추가 성공: itemId=${data.itemId}, operation=${data.operation}`);
            termId.value = "";
            termSpelling.value = "";
            termMeaning.value = "";
            termAbbreviation.value = "";
            termExplanation.value = "";
            termSortOrder.value = "";
            await loadList();
            await selectChangeSet(selectedChangeSetId, true);
        } catch (e) {
            writeLog(`항목 추가 실패: ${e.message}`);
        }
    }

    document.getElementById("loadBtn").addEventListener("click", loadList);
    document.getElementById("createCsBtn").addEventListener("click", createChangeSet);
    document.getElementById("addTermItemBtn").addEventListener("click", addTermItem);
    document.getElementById("validateBtn").addEventListener("click", () => runAction("validate"));
    document.getElementById("approveBtn").addEventListener("click", () => runAction("approve"));
    document.getElementById("applyBtn").addEventListener("click", () => runAction("apply"));
    document.getElementById("saveTokenBtn").addEventListener("click", () => {
        localStorage.setItem("cms_admin_token", token());
        writeLog("토큰을 브라우저 로컬스토리지에 저장했습니다.");
    });
    statusFilter.addEventListener("change", () => renderList(cachedList));

    const saved = localStorage.getItem("cms_admin_token");
    if (saved) tokenInput.value = saved;
    loadList();
</script>
</body>
</html>
