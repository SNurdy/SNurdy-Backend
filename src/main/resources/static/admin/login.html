<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS 로그인</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/login.css" />
</head>
<body>

<section class="login-card">
    <h1 class="login-card__title">관리자 로그인</h1>
    <p class="login-card__desc">SNurdy CMS</p>

    <label class="login-card__label" for="email">이메일</label>
    <input id="email" class="input" type="email" placeholder="admin@snurdy.org" autocomplete="username" />

    <label class="login-card__label" for="password">비밀번호</label>
    <input id="password" class="input" type="password" placeholder="비밀번호" autocomplete="current-password" />

    <button id="loginBtn" class="login-card__submit">로그인</button>
    <div id="error" class="login-card__error"></div>
</section>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
