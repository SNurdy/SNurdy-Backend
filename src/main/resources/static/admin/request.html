<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS 요청 관리</title>
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/request.css" />
</head>
<body>

<div class="layout">
    <!-- 네비게이션 -->
    <nav class="nav">
        <a class="nav__link nav__link--active" href="/api/admin/request.html">요청</a>
        <a class="nav__link" href="/api/admin/validate-waiting.html">검증/반영대기</a>
        <a class="nav__link" href="/api/admin/apply.html">반영</a>
        <a class="nav__link" href="/api/admin/audit-log.html">변경이력</a>
    </nav>

    <section class="panel">
        <!-- 상단 툴바 -->
        <header class="panel__top">
            <button id="refreshBtn" class="btn btn--primary">새로고침</button>
        </header>

        <!-- 탭 -->
        <div class="tabs" id="tabs">
            <button class="tabs__btn tabs__btn--active" data-type="terms">용어</button>
            <button class="tabs__btn" data-type="morphemes">어근어미</button>
        </div>

        <div class="content-grid">
            <!-- 좌측: 목록 -->
            <section class="card">
                <h3 class="card__header" id="listTitle">용어 목록</h3>
                <div class="card__body">
                    <div class="toolbar">
                        <input id="keyword" class="input" placeholder="검색어 입력" />
                        <input id="size" class="input toolbar__size" value="20" />
                        <button id="searchBtn" class="btn btn--primary toolbar__search">조회</button>
                    </div>

                    <table class="table">
                        <thead id="listHead"></thead>
                        <tbody id="listBody"></tbody>
                    </table>

                    <div class="pager">
                        <button id="prevBtn" class="btn">이전</button>
                        <span id="pageInfo">페이지 1 / 1</span>
                        <button id="nextBtn" class="btn">다음</button>
                        <span id="countInfo">총 0건</span>
                    </div>
                </div>
            </section>

            <!-- 우측: 편집 -->
            <section class="card">
                <h3 class="card__header">편집</h3>
                <div class="card__body">
                    <div class="form-grid">
                        <input id="spelling" class="input form-grid__full" placeholder="용어/어근어미 (필수)" />
                        <input id="meaning" class="input form-grid__full" placeholder="뜻 (필수)" />

                        <!-- 용어집 선택 -->
                        <div id="glossaryPicker" class="glossary-picker form-grid__full" style="display:none;">
                            <p class="glossary-picker__title">용어집 선택 (1개 이상 필수)</p>
                            <div id="glossaryChecklist" class="glossary-picker__list"></div>
                        </div>

                        <input id="abbreviation" class="input" placeholder="약어" />
                        <input id="selectedId" class="input" placeholder="선택된 ID (읽기전용)" disabled />
                        <textarea id="explanation" class="input textarea form-grid__full" placeholder="설명"></textarea>

                        <!-- 어근어미 선택 -->
                        <div id="morphemeBox" class="morpheme-box form-grid__full">
                            <div class="morpheme-box__search">
                                <input id="morphemeKeyword" class="input" placeholder="어근어미 검색어" />
                                <button id="searchMorphemeBtn" class="btn">어근어미 검색</button>
                            </div>
                            <div id="morphemeResults" class="morpheme-box__results"></div>
                            <p class="text--muted">선택된 어근어미 (드래그로 순서 조정)</p>
                            <div id="selectedMorphemes" class="morpheme-box__selected"></div>
                        </div>
                    </div>

                    <div class="actions">
                        <button id="newBtn" class="btn">새 항목</button>
                        <button id="createBtn" class="btn btn--primary">생성 요청</button>
                        <button id="updateBtn" class="btn btn--warn">수정 요청</button>
                        <button id="deleteBtn" class="btn btn--danger">삭제 요청</button>
                    </div>

                    <div id="log" class="log">준비되었습니다.</div>
                </div>
            </section>
        </div>
    </section>
</div>

<script src="./js/common.js"></script>
<script src="./js/request.js"></script>
</body>
</html>
