<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS 검증/반영대기</title>
    <style>
        :root { --bg:#f3f6fb; --card:#fff; --line:#d7dfeb; --text:#1f2a36; --muted:#5f7086; --brand:#1362ff; --ok:#067647; --danger:#b42318; --warn:#b54708; }
        * { box-sizing:border-box; }
        body { margin:0; background:linear-gradient(180deg,#f9fbff 0%,var(--bg) 100%); color:var(--text); font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif; }
        .wrap { max-width:1100px; margin:0 auto; padding:20px; }

        /* 네비 */
        .page-nav { display:flex; gap:8px; margin-bottom:10px; }
        .page-link { display:inline-flex; align-items:center; height:34px; padding:0 12px; border:1px solid var(--line); border-radius:999px; color:var(--text); background:#fff; text-decoration:none; font-size:13px; }
        .page-link.active { color:#fff; background:var(--brand); border-color:var(--brand); font-weight:700; }

        /* 패널 */
        .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
        .head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
        .body { padding:16px; }

        /* 입력 */
        .toolbar { display:grid; grid-template-columns: 170px 90px auto; gap:8px; margin-bottom:10px; }
        input, select, button { border:1px solid var(--line); border-radius:8px; font-size:14px; height:36px; padding:0 10px; }
        button { background:#fff; cursor:pointer; }
        button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }

        /* 테이블 */
        table { width:100%; border-collapse:collapse; font-size:13px; }
        th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #edf2f8; vertical-align:top; }
        th { color:var(--muted); font-weight:600; }
        .btn-sm { height:28px; padding:0 8px; font-size:12px; margin-right:4px; }

        /* 상태 배지 */
        .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
        .badge-requested  { background:#e8f0fe; color:#1a56db; }
        .badge-validated  { background:#d1fadf; color:var(--ok); }
        .badge-applied    { background:#f0f0f0; color:#374151; }
        .badge-failed     { background:#fee4e2; color:var(--danger); }
        .badge-canceled   { background:#f5f5f5; color:#6b7280; }

        /* 상세 */
        .detail-card { margin-top:10px; border:1px solid var(--line); border-radius:8px; padding:12px; background:#fbfdff; }
        .detail-title { font-size:14px; font-weight:700; margin-bottom:10px; }
        .kv { display:grid; grid-template-columns:100px 1fr; gap:6px; margin:3px 0; font-size:13px; }
        .kv b { color:var(--muted); font-weight:600; }
        .json-block { margin-top:6px; padding:8px; border-radius:6px; background:#f1f5f9; font-size:12px; white-space:pre-wrap; word-break:break-all; max-height:200px; overflow:auto; }

        /* 로그 */
        .log { margin-top:10px; padding:10px; border-radius:8px; background:#111928; color:#dbe8ff; min-height:74px; white-space:pre-wrap; font-size:12px; }
        .muted { color:var(--muted); }
    </style>
</head>
<body>
<div class="wrap">
    <nav class="page-nav">
        <a class="page-link" href="/api/admin/request.html">요청</a>
        <a class="page-link active" href="/api/admin/validate-waiting.html">검증/반영대기</a>
        <a class="page-link" href="/api/admin/apply.html">반영</a>
    </nav>

    <section class="panel">
        <div class="head">
            <strong>검증/반영대기 목록</strong>
            <span class="muted">요청 건 검증 및 결과 확인</span>
        </div>
        <div class="body">
            <div class="toolbar">
                <select id="status">
                    <option value="">전체</option>
                    <option value="REQUESTED">요청됨</option>
                    <option value="VALIDATED">검증완료</option>
                    <option value="FAILED">검증실패</option>
                    <option value="APPLIED">반영완료</option>
                    <option value="CANCELED">취소됨</option>
                </select>
                <input id="size" value="20" />
                <button id="searchBtn" class="primary">조회</button>
            </div>

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>제목</th>
                    <th>유형</th>
                    <th>작업</th>
                    <th>상태</th>
                    <th>에러/경고</th>
                    <th>액션</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>

            <div id="detail" class="detail-card muted">목록에서 [상세]를 클릭하면 항목 정보가 표시됩니다.</div>
            <div id="log" class="log">준비되었습니다.</div>
        </div>
    </section>
</div>

<script>
    const $ = (id) => document.getElementById(id);

    const statusInput = $("status");
    const sizeInput   = $("size");
    const rowsEl      = $("rows");
    const detailEl    = $("detail");
    const logEl       = $("log");

    /* ── API 경로 ── */
    const API_BASE = "/api/v1/admin/workflows/change-requests";

    /* ── 유틸 ── */
    function writeLog(msg) { logEl.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logEl.textContent; }

    function callApi(path, method = "GET") {
        return fetch(path, {
            method,
            headers: { "Content-Type": "application/json", "X-Request-Id": `cms-${Date.now()}` },
        }).then(async res => {
            const payload = await res.json();
            if (!res.ok || payload.success === false) throw new Error(payload.message || `HTTP ${res.status}`);
            return payload.data;
        });
    }

    function esc(v) {
        if (v == null) return "";
        return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    /* ── 상태 배지 ── */
    const STATUS_MAP = {
        REQUESTED: { label: "요청됨",   cls: "badge-requested" },
        VALIDATED: { label: "검증완료", cls: "badge-validated" },
        APPLIED:   { label: "반영완료", cls: "badge-applied" },
        FAILED:    { label: "검증실패", cls: "badge-failed" },
        CANCELED:  { label: "취소됨",   cls: "badge-canceled" },
    };

    function statusBadge(status) {
        const s = STATUS_MAP[status] || { label: status, cls: "" };
        return `<span class="badge ${s.cls}">${s.label}</span>`;
    }

    /* ── 상세 렌더 ── */
    function safeJson(v) { if (!v) return null; try { return JSON.parse(v); } catch { return null; } }

    function formatJson(obj) {
        if (!obj) return "-";
        return JSON.stringify(obj, null, 2);
    }

    function renderDetail(d) {
        const before = safeJson(d.beforeJson);
        const after  = safeJson(d.afterJson);

        return `
            <div class="detail-title">요청 상세 #${d.id}</div>
            <div class="kv"><b>유형</b>     <span>${d.entityType} / ${d.operation}</span></div>
            <div class="kv"><b>대상 PK</b>  <span>${d.entityPk || "-"}</span></div>
            <div class="kv"><b>상태</b>     <span>${statusBadge(d.status)}</span></div>
            <div class="kv"><b>요청자</b>   <span>${d.requestedBy || "-"}</span></div>
            <div class="kv"><b>생성시각</b> <span>${d.createdAt || "-"}</span></div>
            <div class="kv"><b>에러코드</b> <span>${esc(d.errorCode) || "-"}</span></div>
            <div class="kv"><b>에러메시지</b><span>${esc(d.errorMessage) || "-"}</span></div>
            <div class="kv"><b>경고</b>     <span>${esc(d.warningMessage) || "-"}</span></div>
            ${before ? `<div style="margin-top:8px;"><b>변경 전</b><div class="json-block">${esc(formatJson(before))}</div></div>` : ""}
            ${after  ? `<div style="margin-top:8px;"><b>변경 후</b><div class="json-block">${esc(formatJson(after))}</div></div>` : ""}
        `;
    }

    /* ── 에러/경고 요약 컬럼 ── */
    function summaryText(item) {
        if (item.errorMessage) return `❌ ${item.errorMessage}`;
        if (item.warningMessage) return `⚠️ ${item.warningMessage}`;
        return "-";
    }

    /* ── 목록 조회 ── */
    async function loadList() {
        const size   = Number(sizeInput.value || 20);
        const status = statusInput.value;
        const params = new URLSearchParams({ page: "0", size: String(size) });
        if (status) params.set("status", status);

        const data  = await callApi(`${API_BASE}?${params}`);
        const items = data.items || [];

        if (items.length === 0) {
            rowsEl.innerHTML = `<tr><td colspan="7" class="muted">데이터가 없습니다.</td></tr>`;
            return;
        }

        rowsEl.innerHTML = items.map(it => `
            <tr>
                <td>${it.id}</td>
                <td>${esc(it.title)}</td>
                <td>${it.entityType}</td>
                <td>${it.operation}</td>
                <td>${statusBadge(it.status)}</td>
                <td style="max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(summaryText(it))}</td>
                <td>
                    <button class="btn-sm" data-action="detail"   data-id="${it.id}">상세</button>
                    <button class="btn-sm" data-action="validate" data-id="${it.id}">검증</button>
                    <button class="btn-sm" data-action="cancel"   data-id="${it.id}">취소</button>
                </td>
            </tr>
        `).join("");

        /* 버튼 이벤트 */
        rowsEl.querySelectorAll("button").forEach(btn => {
            btn.addEventListener("click", async () => {
                const id  = Number(btn.dataset.id);
                const act = btn.dataset.action;

                if (act === "detail") {
                    try {
                        const d = await callApi(`${API_BASE}/${id}`);
                        detailEl.classList.remove("muted");
                        detailEl.innerHTML = renderDetail(d);
                        writeLog(`상세 조회: 요청ID=${id}`);
                    } catch (e) { writeLog(`상세 조회 실패: ${e.message}`); }
                    return;
                }

                if (act === "validate") {
                    try {
                        const r = await callApi(`${API_BASE}/${id}/validate`, "POST");
                        writeLog(`검증 완료: 요청ID=${id}, 상태=${r.status}${r.warningMessage ? ", 경고=" + r.warningMessage : ""}`);
                        if (r.status === "VALIDATED") statusInput.value = "VALIDATED";
                        else if (r.status === "FAILED") statusInput.value = "FAILED";
                        await loadList();
                    } catch (e) { writeLog(`검증 실패: ${e.message}`); }
                    return;
                }

                if (act === "cancel") {
                    if (!confirm(`요청ID ${id}를 취소하시겠습니까?`)) return;
                    try {
                        const r = await callApi(`${API_BASE}/${id}/cancel`, "POST");
                        writeLog(`취소 완료: 요청ID=${id}, 상태=${r.status}`);
                        await loadList();
                    } catch (e) { writeLog(`취소 실패: ${e.message}`); }
                }
            });
        });
    }

    /* ── 이벤트 ── */
    $("searchBtn").addEventListener("click", () => loadList().catch(e => writeLog(`조회 실패: ${e.message}`)));

    /* ── 초기 로드 ── */
    loadList().catch(e => writeLog(`초기 조회 실패: ${e.message}`));
</script>
</body>
</html>
