<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS 검증/반영대기</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/validate-waiting.css" />
</head>
<body>

<div class="layout">
    <nav class="nav">
        <a class="nav__link" href="/api/admin/request.html">요청</a>
        <a class="nav__link nav__link--active" href="/api/admin/validate-waiting.html">검증/반영대기</a>
        <a class="nav__link" href="/api/admin/apply.html">반영</a>
        <a class="nav__link" href="/api/admin/audit-log.html">변경이력</a>
    </nav>

    <section class="panel">
        <header class="panel__header">
            <strong>검증/반영대기 목록</strong>
            <span class="text--muted">요청 건 검증 및 결과 확인</span>
        </header>

        <div class="panel__body">
            <div class="toolbar">
                <select id="status" class="input">
                    <option value="">전체</option>
                    <option value="REQUESTED">요청됨</option>
                    <option value="VALIDATED">검증완료</option>
                    <option value="FAILED">검증실패</option>
                    <option value="APPLIED">반영완료</option>
                    <option value="ROLLED_BACK">롤백됨</option>
                    <option value="CANCELED">취소됨</option>
                </select>
                <input id="size" class="input" value="20" />
                <button id="searchBtn" class="btn btn--primary toolbar__search">조회</button>
            </div>

            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>제목</th>
                    <th>유형</th>
                    <th>작업</th>
                    <th>상태</th>
                    <th>에러/경고</th>
                    <th>액션</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>

            <div id="log" class="log">준비되었습니다.</div>
        </div>
    </section>
</div>

<script src="js/common.js"></script>
<script src="js/validate-waiting.js"></script>
</body>
</html>
